<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wirtualny spacer — mieszkanie</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      :root { color-scheme: light; font-family: Inter, Arial, sans-serif; }
      body { margin: 0; background: #f5f5f2; color: #1f2522; }
      header { position: absolute; z-index: 1; padding: 20px 24px; }
      h1 { margin: 0; font-size: 18px; font-weight: 650; }
      p { margin: 6px 0 0; color: #5f6661; font-size: 14px; }
      model-viewer { width: 100vw; height: 100vh; background: linear-gradient(160deg, #f5f4ef, #dfe4e2); }
      .tip { position: absolute; bottom: 20px; left: 24px; margin: 0; padding: 9px 12px; border-radius: 8px; background: #fffffff0; font-size: 13px; }
    </style>
  </head>
  <body>
    <header><h1>Mieszkanie</h1><p>Interaktywny model 3D</p></header>
    <model-viewer src="mieszkanie.glb" alt="Model 3D mieszkania" camera-controls touch-action="pan-y" shadow-intensity="0.8" exposure="1" auto-rotate-delay="3000"></model-viewer>
    <p class="tip">Przeciągnij, aby obrócić · kółko myszy / gest szczypania, aby przybliżyć</p>
  </body>
</html>
