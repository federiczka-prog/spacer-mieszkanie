<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wirtualny spacer — mieszkanie</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#11110f;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

/* LOADING */

#loading{
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#161613;
  color:white;
  transition:opacity .5s ease;
}

#loading.hidden{
  opacity:0;
  pointer-events:none;
}

.loader{
  text-align:center;
}

.spinner{
  width:32px;
  height:32px;
  margin:0 auto 15px;
  border:2px solid rgba(255,255,255,.15);
  border-top-color:white;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* START */

#startScreen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:8vh;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.02),
      rgba(0,0,0,.72)
    );
  transition:opacity .6s ease,visibility .6s ease;
}

#startScreen.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.startBox{
  text-align:center;
  color:white;
  width:min(620px,90%);
}

.startSmall{
  font-size:10px;
  letter-spacing:.3em;
  text-transform:uppercase;
  opacity:.7;
  margin-bottom:14px;
}

.startTitle{
  font-size:clamp(40px,6vw,70px);
  font-weight:300;
  letter-spacing:-.05em;
  margin:0;
}

.startDescription{
  margin:15px auto 26px;
  max-width:500px;
  font-size:13px;
  line-height:1.7;
  color:rgba(255,255,255,.72);
}

#startButton{
  border:0;
  background:#eee9de;
  color:#171713;
  height:52px;
  padding:0 32px;
  border-radius:999px;
  font-size:11px;
  letter-spacing:.1em;
  cursor:pointer;
}

/* TOP */

#topBar{
  position:fixed;
  z-index:20;
  top:0;
  left:0;
  right:0;
  padding:25px 28px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
  background:linear-gradient(rgba(12,12,10,.6),transparent);
}

.brand{
  color:white;
}

.brandSmall{
  font-size:9px;
  letter-spacing:.25em;
  text-transform:uppercase;
  opacity:.5;
  margin-bottom:7px;
}

.brandTitle{
  font-size:21px;
  font-weight:500;
}

.brandSubtitle{
  font-size:11px;
  opacity:.45;
  margin-top:5px;
}

.topButtons{
  display:flex;
  gap:8px;
  pointer-events:auto;
}

.topButton{
  height:40px;
  padding:0 15px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(20,20,17,.65);
  color:white;
  backdrop-filter:blur(15px);
  cursor:pointer;
}

/* ROOMS */

#rooms{
  position:fixed;
  z-index:20;
  left:24px;
  top:50%;
  transform:translateY(-50%);
  width:245px;
  padding:15px;
  border-radius:18px;
  background:rgba(20,20,17,.78);
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(20px);
  color:white;
}

.roomsTitle{
  font-size:9px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(255,255,255,.45);
  padding:4px 8px 11px;
}

.room{
  width:100%;
  display:grid;
  grid-template-columns:28px 1fr;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.68);
  text-align:left;
  padding:9px;
  border-radius:10px;
  cursor:pointer;
}

.room:hover,
.room.active{
  background:rgba(255,255,255,.1);
  color:white;
}

.roomNumber{
  font-size:9px;
  opacity:.4;
}

.roomName{
  display:block;
  font-size:12px;
}

.roomArea{
  display:block;
  font-size:9px;
  opacity:.35;
  margin-top:3px;
}

/* BADGE */

#modeBadge{
  position:fixed;
  z-index:21;
  right:28px;
  bottom:82px;
  padding:9px 13px;
  border-radius:999px;
  background:rgba(20,20,17,.68);
  border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.65);
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  backdrop-filter:blur(15px);
}

/* BOTTOM */

#bottom{
  position:fixed;
  z-index:20;
  left:24px;
  right:24px;
  bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
}

#hint{
  padding:10px 13px;
  border-radius:11px;
  background:rgba(20,20,17,.7);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(15px);
  color:rgba(255,255,255,.55);
  font-size:10px;
}

#controls{
  display:flex;
  gap:4px;
  padding:5px;
  border-radius:999px;
  background:rgba(20,20,17,.75);
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(15px);
  pointer-events:auto;
}

.control{
  width:40px;
  height:36px;
  border:0;
  border-radius:999px;
  background:transparent;
  color:white;
  cursor:pointer;
}

.control:hover{
  background:rgba(255,255,255,.08);
}

/* MOBILE */

@media(max-width:700px){

  #topBar{
    padding:15px;
  }

  .brandTitle{
    font-size:18px;
  }

  .brandSubtitle{
    display:none;
  }

  .topButton:first-child{
    display:none;
  }

  #rooms{
    left:10px;
    right:10px;
    bottom:68px;
    top:auto;
    width:auto;
    transform:none;
    display:flex;
    overflow-x:auto;
    padding:7px;
  }

  .roomsTitle{
    display:none;
  }

  .room{
    min-width:145px;
  }

  #bottom{
    left:10px;
    right:10px;
    bottom:10px;
  }

  #hint{
    display:none;
  }

  #modeBadge{
    right:12px;
    bottom:64px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="loading">
  <div class="loader">
    <div class="spinner"></div>
    <div class="loadingText">
      Ładowanie mieszkania…
    </div>
  </div>
</div>

<div id="startScreen">
  <div class="startBox">

    <div class="startSmall">
      Wirtualny spacer
    </div>

    <h1 class="startTitle">
      Mieszkanie
    </h1>

    <p class="startDescription">
      Obejrzyj układ mieszkania z góry,
      a następnie wejdź do wnętrza
      i rozglądaj się w 360°.
    </p>

    <button id="startButton">
      ROZPOCZNIJ SPACER
    </button>

  </div>
</div>

<header id="topBar">

  <div class="brand">

    <div class="brandSmall">
      Wirtualny spacer
    </div>

    <div class="brandTitle">
      Mieszkanie
    </div>

    <div class="brandSubtitle">
      Interaktywna prezentacja wnętrza
    </div>

  </div>

  <div class="topButtons">

    <button
      class="topButton"
      id="overviewButton">
      Rzut 3D
    </button>

    <button
      class="topButton"
      id="fullscreenButton">
      ⛶
    </button>

  </div>

</header>

<aside id="rooms">

  <div class="roomsTitle">
    Pomieszczenia
  </div>

  <div id="roomList"></div>

</aside>

<div id="modeBadge">
  Rzut 3D
</div>

<div id="bottom">

  <div id="hint">
    Przeciągnij, aby się rozglądać · kliknij pomieszczenie, aby przejść
  </div>

  <div id="controls">

    <button
      class="control"
      id="resetButton">
      ↻
    </button>

    <button
      class="control"
      id="fullscreenButton2">
      ⛶
    </button>

  </div>

</div>

<script type="module">

import * as THREE from
"https://unpkg.com/three@0.160.0/build/three.module.js";

import { GLTFLoader } from
"https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


/* --------------------------------
   SCENA
-------------------------------- */

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0xd5d3cc);


/* --------------------------------
   KAMERA
-------------------------------- */

const camera =
  new THREE.PerspectiveCamera(
    70,
    window.innerWidth /
    window.innerHeight,
    0.05,
    1000
  );


/* --------------------------------
   RENDERER
-------------------------------- */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    logarithmicDepthBuffer:true
  });

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1;

document
  .getElementById("app")
  .appendChild(renderer.domElement);


/* --------------------------------
   ŚWIATŁO
-------------------------------- */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x555555,
    2
  )
);

const directional =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

directional.position.set(
  110,
  20,
  275
);

scene.add(directional);


/* --------------------------------
   DANE PUNKTÓW
-------------------------------- */

let points = [];

let currentPoint = null;

let overview = true;

let dragging = false;

let yaw = 0;
let pitch = 0;

let previousX = 0;
let previousY = 0;


/*
   SketchUp:
   X -> X
   Z -> Y
   -Y -> Z

   cale -> metry
*/

function convertPoint(point){

  return {

    name: point.name,

    position:
      new THREE.Vector3(
        point.x * 0.0254,
        point.z * 0.0254,
        -point.y * 0.0254
      ),

    target:
      new THREE.Vector3(
        point.target_x * 0.0254,
        point.target_z * 0.0254,
        -point.target_y * 0.0254
      ),

    fov:
      point.fov || 90

  };

}


/* --------------------------------
   ŁADOWANIE JSON
-------------------------------- */

async function loadPoints(){

  const response =
    await fetch(
      "punkty_spaceru.json",
      {
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "Nie można wczytać punkty_spaceru.json"
    );

  }

  const data =
    await response.json();

  points =
    data.map(convertPoint);

}


/* --------------------------------
   NAZWY POMIESZCZEŃ
-------------------------------- */

const roomMeta = {

  SPACER_KORYTARZ:
    ["Korytarz","11,48 m²"],

  SPACER_SALON_KUCHNIA:
    ["Salon + kuchnia","30,77 m²"],

  SPACER_LAZIENKA:
    ["Łazienka","4,96 m²"],

  SPACER_SYPIALNIA_01:
    ["Sypialnia 01","11,83 m²"],

  SPACER_WC:
    ["WC","1,65 m²"],

  SPACER_GARDEROBA:
    ["Garderoba","3,75 m²"],

  SPACER_SYPIALNIA_02:
    ["Sypialnia 02","12,63 m²"]

};


/* --------------------------------
   LISTA POMIESZCZEŃ
-------------------------------- */

function buildRooms(){

  const list =
    document.getElementById(
      "roomList"
    );

  list.innerHTML = "";

  const interiorPoints =
    points.filter(
      point =>
        point.name !== "SPACER_START"
    );

  interiorPoints.forEach(
    (point,index)=>{

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "room";

      button.dataset.point =
        point.name;

      const meta =
        roomMeta[point.name] ||
        [
          point.name
            .replace("SPACER_","")
            .replaceAll("_"," "),
          ""
        ];

      button.innerHTML = `

        <span class="roomNumber">
          ${String(index+1).padStart(2,"0")}
        </span>

        <span>
          <span class="roomName">
            ${meta[0]}
          </span>

          <span class="roomArea">
            ${meta[1]}
          </span>
        </span>

      `;

      button.addEventListener(
        "click",
        () => {

          goToPoint(
            point.name
          );

        }
      );

      list.appendChild(button);

    }
  );

}


/* --------------------------------
   USTAWIENIE KAMERY
-------------------------------- */

function setCamera(
  point,
  animate = true
){

  const from =
    camera.position.clone();

  const to =
    point.position.clone();

  const target =
    point.target.clone();

  const newFov =
    point.fov || 90;


  const dx =
    target.x - to.x;

  const dy =
    target.y - to.y;

  const dz =
    target.z - to.z;


  yaw =
    Math.atan2(
      -dx,
      -dz
    );


  pitch =
    Math.atan2(
      dy,
      Math.sqrt(
        dx*dx +
        dz*dz
      )
    );


  if(!animate){

    camera.position.copy(to);

    camera.fov =
      newFov;

    camera.updateProjectionMatrix();

    camera.lookAt(target);

    currentPoint =
      point;

    return;

  }


  const start =
    performance.now();

  const duration =
    750;


  function animateCamera(now){

    const t =
      Math.min(
        1,
        (now-start) /
        duration
      );


    const ease =
      t*t*(3-2*t);


    camera.position.lerpVectors(
      from,
      to,
      ease
    );


    camera.fov =
      THREE.MathUtils.lerp(
        camera.fov,
        newFov,
        ease
      );


    camera.updateProjectionMatrix();

    camera.lookAt(
      target
    );


    if(t < 1){

      requestAnimationFrame(
        animateCamera
      );

    }else{

      currentPoint =
        point;

    }

  }


  requestAnimationFrame(
    animateCamera
  );

}


/* --------------------------------
   WIDOK 360
-------------------------------- */

function applyLook(){

  if(
    overview ||
    !currentPoint
  ){

    return;

  }


  const distance = 2;


  const target =
    new THREE.Vector3(

      camera.position.x -
        Math.sin(yaw) *
        Math.cos(pitch) *
        distance,

      camera.position.y +
        Math.sin(pitch) *
        distance,

      camera.position.z -
        Math.cos(yaw) *
        Math.cos(pitch) *
        distance

    );


  camera.lookAt(
    target
  );

}


/* --------------------------------
   PRZEJŚCIE DO PUNKTU
-------------------------------- */

function goToPoint(name){

  const point =
    points.find(
      item =>
        item.name === name
    );

  if(!point){

    return;

  }


  overview = false;


  document
    .getElementById(
      "modeBadge"
    )
    .textContent =
      roomMeta[name]?.[0] ||
      name;


  document
    .querySelectorAll(".room")
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.point === name
        );

      }
    );


  setCamera(
    point,
    true
  );

}


/* --------------------------------
   RZUT 3D
-------------------------------- */

function goOverview(){

  const point =
    points.find(
      item =>
        item.name ===
        "SPACER_START"
    );

  if(!point){

    return;

  }


  overview = true;

  currentPoint =
    point;


  document
    .getElementById(
      "modeBadge"
    )
    .textContent =
      "Rzut 3D";


  document
    .querySelectorAll(".room")
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );


  setCamera(
    point,
    false
  );

}


/* --------------------------------
   START
-------------------------------- */

document
  .getElementById(
    "startButton"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "startScreen"
        )
        .classList.add(
          "hidden"
        );


      const first =
        points.find(
          point =>
            point.name ===
            "SPACER_KORYTARZ"
        );


      if(first){

        goToPoint(
          first.name
        );

      }

    }
  );


/* --------------------------------
   RZUT 3D
-------------------------------- */

document
  .getElementById(
    "overviewButton"
  )
  .addEventListener(
    "click",
    goOverview
  );


/* --------------------------------
   RESET
-------------------------------- */

document
  .getElementById(
    "resetButton"
  )
  .addEventListener(
    "click",
    () => {

      if(overview){

        goOverview();

      }else if(currentPoint){

        setCamera(
          currentPoint,
          false
        );

      }

    }
  );


/* --------------------------------
   MYSZ
-------------------------------- */

renderer.domElement
  .addEventListener(
    "pointerdown",
    event => {

      if(overview){

        return;

      }


      dragging = true;

      previousX =
        event.clientX;

      previousY =
        event.clientY;


      renderer.domElement
        .setPointerCapture(
          event.pointerId
        );

    }
  );


renderer.domElement
  .addEventListener(
    "pointermove",
    event => {

      if(
        !dragging ||
        overview
      ){

        return;

      }


      const dx =
        event.clientX -
        previousX;

      const dy =
        event.clientY -
        previousY;


      previousX =
        event.clientX;

      previousY =
        event.clientY;


      yaw -=
        dx * 0.003;


      pitch -=
        dy * 0.0025;


      const limit =
        Math.PI / 2.05;


      pitch =
        Math.max(
          -limit,
          Math.min(
            limit,
            pitch
          )
        );

    }
  );


renderer.domElement
  .addEventListener(
    "pointerup",
    () => {

      dragging = false;

    }
  );


renderer.domElement
  .addEventListener(
    "pointercancel",
    () => {

      dragging = false;

    }
  );


/* --------------------------------
   FULLSCREEN
-------------------------------- */

async function fullscreen(){

  try{

    if(
      !document.fullscreenElement
    ){

      await document
        .documentElement
        .requestFullscreen();

    }else{

      await document
        .exitFullscreen();

    }

  }catch(error){

    console.error(error);

  }

}


document
  .getElementById(
    "fullscreenButton"
  )
  .addEventListener(
    "click",
    fullscreen
  );


document
  .getElementById(
    "fullscreenButton2"
  )
  .addEventListener(
    "click",
    fullscreen
  );


/* --------------------------------
   ŁADOWANIE MODELU
-------------------------------- */

const loader =
  new GLTFLoader();


async function loadModel(){

  try{

    await loadPoints();

    buildRooms();


    const files = [

      "mieszkanie.part1",
      "mieszkanie.part2"

    ];


    const buffers =
      await Promise.all(

        files.map(
          async file => {

            const response =
              await fetch(file);

            if(!response.ok){

              throw new Error(
                "Nie można wczytać " +
                file
              );

            }

            return response
              .arrayBuffer();

          }
        )

      );


    const total =
      buffers[0].byteLength +
      buffers[1].byteLength;


    const combined =
      new Uint8Array(
        total
      );


    combined.set(
      new Uint8Array(
        buffers[0]
      ),
      0
    );


    combined.set(
      new Uint8Array(
        buffers[1]
      ),
      buffers[0].byteLength
    );


    loader.parse(

      combined.buffer,

      "",

      gltf => {

        scene.add(
          gltf.scene
        );


        loading
          .classList
          .add(
            "hidden"
          );


        goOverview();

      },

      error => {

        console.error(
          error
        );


        document
          .querySelector(
            ".loadingText"
          )
          .textContent =
            "Błąd ładowania modelu";

      }

    );


  }catch(error){

    console.error(
      error
    );


    document
      .querySelector(
        ".loadingText"
      )
      .textContent =
        "Błąd: " +
        error.message;

  }

}


loadModel();


/* --------------------------------
   RESIZE
-------------------------------- */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* --------------------------------
   ANIMACJA
-------------------------------- */

function animate(){

  requestAnimationFrame(
    animate
  );


  if(!overview){

    applyLook();

  }


  renderer.render(
    scene,
    camera
  );

}


animate();

</script>

</body>
</html>
