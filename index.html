<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wirtualny spacer</title>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

#app {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #161613;
    color: white;

    font-size: 14px;
}

#loading.hidden {
    display: none;
}

#error {
    position: fixed;
    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    max-width: 600px;
    padding: 25px;

    background: #201b1b;
    color: white;

    border-radius: 15px;

    font-size: 13px;
    line-height: 1.6;

    display: none;
}
</style>
</head>


<body>

<div id="app"></div>

<div id="loading">
    Ładowanie mieszkania…
</div>

<div id="error"></div>


<script type="importmap">
{
    "imports": {
        "three":
        "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from
"https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


/* ==========================================
   SCENA
========================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0xd5d3cc);


/* ==========================================
   KAMERA
========================================== */

const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.01,
        10000
    );


/* ==========================================
   RENDERER
========================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        logarithmicDepthBuffer: true
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    1;


document
    .getElementById("app")
    .appendChild(
        renderer.domElement
    );


/* ==========================================
   ŚWIATŁO
========================================== */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x555555,
        2
    )
);


const light =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );


light.position.set(
    100,
    100,
    100
);


scene.add(light);


/* ==========================================
   BŁĄD
========================================== */

function showError(message) {

    console.error(message);

    const error =
        document.getElementById(
            "error"
        );

    error.style.display =
        "block";

    error.textContent =
        message;

    document
        .getElementById(
            "loading"
        )
        .classList.add(
            "hidden"
        );
}


/* ==========================================
   ŁADOWANIE MODELU
========================================== */

async function loadModel() {

    try {

        console.log(
            "Ładowanie części modelu..."
        );


        const part1 =
            await fetch(
                "mieszkanie.part1"
            );


        if (!part1.ok) {

            throw new Error(
                "Nie można pobrać mieszkanie.part1"
            );

        }


        const part2 =
            await fetch(
                "mieszkanie.part2"
            );


        if (!part2.ok) {

            throw new Error(
                "Nie można pobrać mieszkanie.part2"
            );

        }


        const buffer1 =
            await part1.arrayBuffer();


        const buffer2 =
            await part2.arrayBuffer();


        console.log(
            "PART 1:",
            buffer1.byteLength
        );


        console.log(
            "PART 2:",
            buffer2.byteLength
        );


        /*
           Łączymy oba fragmenty.
        */

        const combined =
            new Uint8Array(
                buffer1.byteLength +
                buffer2.byteLength
            );


        combined.set(
            new Uint8Array(
                buffer1
            ),
            0
        );


        combined.set(
            new Uint8Array(
                buffer2
            ),
            buffer1.byteLength
        );


        console.log(
            "Łączny rozmiar:",
            combined.byteLength
        );


        /* ==================================
           GLTF
        ================================== */

        const loader =
            new GLTFLoader();


        loader.parse(

            combined.buffer,

            "",

            function(gltf) {

                console.log(
                    "MODEL ZAŁADOWANY",
                    gltf
                );


                scene.add(
                    gltf.scene
                );


                /*
                   Obliczamy środek
                   i wielkość modelu.
                */

                const box =
                    new THREE.Box3()
                        .setFromObject(
                            gltf.scene
                        );


                const center =
                    box.getCenter(
                        new THREE.Vector3()
                    );


                const size =
                    box.getSize(
                        new THREE.Vector3()
                    );


                console.log(
                    "CENTER:",
                    center
                );


                console.log(
                    "SIZE:",
                    size
                );


                /*
                   Pierwszy widok:
                   rzut mieszkania z góry.
                */

                const maxSize =
                    Math.max(
                        size.x,
                        size.z
                    );


                camera.position.set(

                    center.x,

                    center.y +
                    maxSize * 1.2,

                    center.z

                );


                camera.lookAt(
                    center
                );


                document
                    .getElementById(
                        "loading"
                    )
                    .classList.add(
                        "hidden"
                    );

            },

            function(error) {

                console.error(
                    "BŁĄD GLTF:",
                    error
                );


                showError(
                    "Model nie może zostać odczytany. " +
                    "Sprawdź konsolę przeglądarki."
                );

            }

        );

    }
    catch(error) {

        showError(
            error.message
        );

    }

}


/* ==========================================
   RESIZE
========================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* ==========================================
   ANIMACJA
========================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    renderer.render(
        scene,
        camera
    );

}


animate();


/* ==========================================
   START
========================================== */

loadModel();

</script>

</body>
</html>
