<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Wirtualny spacer — mieszkanie</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #11110f;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

#app {

  position: fixed;

  inset: 0;

  overflow: hidden;

  background: #11110f;
}

canvas {

  display: block;

  width: 100%;
  height: 100%;

}


/* =========================================
   START SCREEN
========================================= */

#startScreen {

  position: fixed;

  inset: 0;

  z-index: 100;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    linear-gradient(
      rgba(15,15,13,.55),
      rgba(15,15,13,.65)
    );

  backdrop-filter: blur(4px);

  transition:
    opacity .6s ease,
    visibility .6s ease;
}

#startScreen.hidden {

  opacity: 0;

  visibility: hidden;

  pointer-events: none;
}

.startBox {

  text-align: center;

  color: white;

  width: min(520px, 90%);
}

.startSmall {

  font-size: 10px;

  letter-spacing: .3em;

  text-transform: uppercase;

  opacity: .55;

  margin-bottom: 20px;
}

.startTitle {

  font-size:
    clamp(42px, 7vw, 72px);

  font-weight: 300;

  letter-spacing: -.05em;

  margin: 0;
}

.startDescription {

  margin:
    22px auto 30px;

  max-width: 430px;

  font-size: 13px;

  line-height: 1.7;

  color:
    rgba(255,255,255,.65);
}

#startButton {

  border: 0;

  background: #eee9de;

  color: #171713;

  height: 50px;

  padding:
    0 28px;

  border-radius: 999px;

  font-size: 11px;

  letter-spacing: .08em;

  cursor: pointer;

  transition:
    transform .2s ease;
}

#startButton:hover {

  transform:
    scale(1.03);
}


/* =========================================
   TOP BAR
========================================= */

#topBar {

  position: fixed;

  z-index: 20;

  top: 0;
  left: 0;
  right: 0;

  padding:
    25px 28px;

  display: flex;

  justify-content:
    space-between;

  align-items:
    flex-start;

  pointer-events:
    none;

  background:
    linear-gradient(
      rgba(12,12,10,.55),
      transparent
    );
}

.brand {

  color: white;
}

.brandSmall {

  font-size: 9px;

  letter-spacing: .25em;

  text-transform: uppercase;

  opacity: .5;

  margin-bottom: 7px;
}

.brandTitle {

  font-size: 21px;

  font-weight: 500;
}

.brandSubtitle {

  font-size: 11px;

  opacity: .45;

  margin-top: 5px;
}

.topButtons {

  display: flex;

  gap: 8px;

  pointer-events:
    auto;
}

.topButton {

  height: 40px;

  padding:
    0 15px;

  border-radius: 999px;

  border:
    1px solid
    rgba(255,255,255,.15);

  background:
    rgba(20,20,17,.65);

  color: white;

  backdrop-filter:
    blur(15px);

  cursor: pointer;
}


/* =========================================
   ROOMS
========================================= */

#rooms {

  position: fixed;

  z-index: 20;

  left: 25px;

  top: 50%;

  transform:
    translateY(-50%);

  width: 235px;

  padding: 15px;

  border-radius: 18px;

  background:
    rgba(20,20,17,.76);

  border:
    1px solid
    rgba(255,255,255,.13);

  backdrop-filter:
    blur(20px);

  color: white;
}

.roomsTitle {

  font-size: 9px;

  letter-spacing: .2em;

  text-transform: uppercase;

  color:
    rgba(255,255,255,.45);

  padding:
    4px 8px 11px;
}

.room {

  width: 100%;

  display: grid;

  grid-template-columns:
    25px 1fr auto;

  gap: 7px;

  border: 0;

  background:
    transparent;

  color:
    rgba(255,255,255,.65);

  text-align: left;

  padding: 9px;

  border-radius: 10px;

  cursor: pointer;

  transition:
    background .2s ease,
    color .2s ease;
}

.room:hover {

  background:
    rgba(255,255,255,.07);

  color: white;
}

.room.active {

  background:
    rgba(255,255,255,.11);

  color: white;
}

.roomNumber {

  font-size: 9px;

  opacity: .4;
}

.roomName {

  font-size: 12px;
}

.roomArea {

  font-size: 9px;

  opacity: .35;
}


/* =========================================
   BOTTOM
========================================= */

#bottom {

  position: fixed;

  z-index: 20;

  left: 25px;

  right: 25px;

  bottom: 20px;

  display: flex;

  justify-content:
    space-between;

  align-items:
    center;

  pointer-events:
    none;
}

#hint {

  padding:
    10px 13px;

  border-radius: 11px;

  background:
    rgba(20,20,17,.7);

  border:
    1px solid
    rgba(255,255,255,.12);

  backdrop-filter:
    blur(15px);

  color:
    rgba(255,255,255,.5);

  font-size: 10px;
}

#controls {

  display: flex;

  gap: 4px;

  padding: 5px;

  border-radius: 999px;

  background:
    rgba(20,20,17,.75);

  border:
    1px solid
    rgba(255,255,255,.13);

  backdrop-filter:
    blur(15px);

  pointer-events:
    auto;
}

.control {

  width: 40px;

  height: 36px;

  border: 0;

  border-radius: 999px;

  background:
    transparent;

  color: white;

  cursor: pointer;
}

.control:hover {

  background:
    rgba(255,255,255,.08);
}


/* =========================================
   LOADING
========================================= */

#loading {

  position: fixed;

  inset: 0;

  z-index: 200;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #161613;

  color: white;

  transition:
    opacity .5s ease;
}

#loading.hidden {

  opacity: 0;

  pointer-events: none;
}

.loader {

  text-align: center;
}

.spinner {

  width: 30px;

  height: 30px;

  margin:
    0 auto 15px;

  border-radius: 50%;

  border:
    2px solid
    rgba(255,255,255,.15);

  border-top-color:
    white;

  animation:
    spin 1s linear infinite;
}

@keyframes spin {

  to {

    transform:
      rotate(360deg);
  }
}

.loadingText {

  font-size: 13px;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:700px) {

  #topBar {

    padding: 16px;
  }

  .brandTitle {

    font-size: 18px;
  }

  .brandSubtitle {

    display: none;
  }

  .topButton:first-child {

    display: none;
  }

  #rooms {

    left: 10px;

    right: 10px;

    bottom: 70px;

    top: auto;

    width: auto;

    transform: none;

    display: flex;

    overflow-x: auto;

    padding: 7px;
  }

  .roomsTitle {

    display: none;
  }

  .room {

    min-width: 145px;
  }

  #bottom {

    left: 10px;

    right: 10px;

    bottom: 10px;
  }

  #hint {

    display: none;
  }

}

</style>

<script type="module">

import * as THREE
  from "three";


import {
  GLTFLoader
}
from
  "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


/* =====================================================
   SCENE
===================================================== */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(
    0xd5d3cc
  );


/* =====================================================
   CAMERA
===================================================== */

const camera =
  new THREE.PerspectiveCamera(

    70,

    window.innerWidth /
    window.innerHeight,

    0.01,

    10000

  );


/* =====================================================
   RENDERER
===================================================== */

const renderer =
  new THREE.WebGLRenderer({

    antialias: true,

    logarithmicDepthBuffer: true

  });


renderer.setPixelRatio(

  Math.min(
    window.devicePixelRatio,
    2
  )

);

renderer.setSize(

  window.innerWidth,

  window.innerHeight

);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
  1;

renderer.localClippingEnabled =
  true;


document
  .getElementById("app")
  .appendChild(
    renderer.domElement
  );


/* =====================================================
   LIGHT
===================================================== */

scene.add(

  new THREE.HemisphereLight(

    0xffffff,

    0x555555,

    2

  )

);


const directional =
  new THREE.DirectionalLight(

    0xffffff,

    2

  );


directional.position.set(

  110,

  30,

  275

);


scene.add(
  directional
);


/* =====================================================
   MODEL
===================================================== */

let model = null;

let modelBox = null;

let modelCenter = null;

let modelSize = null;

let topCutPlane = null;


/* =====================================================
   SCENY
===================================================== */

let scenes = [];


/* =====================================================
   USTAWIENIA POMIESZCZEŃ
===================================================== */

const roomSettings = {

  "SPACER_KORYTARZ": {

    number: "01",

    name: "Korytarz",

    area: "11,48 m²"

  },

  "SPACER_SALON_KUCHNIA": {

    number: "02",

    name: "Salon + kuchnia",

    area: "30,77 m²"

  },

  "SPACER_LAZIENKA": {

    number: "03",

    name: "Łazienka",

    area: "4,96 m²"

  },

  "SPACER_SYPIALNIA_01": {

    number: "04",

    name: "Sypialnia 01",

    area: "11,83 m²"

  },

  "SPACER_WC": {

    number: "05",

    name: "WC",

    area: "1,65 m²"

  },

  "SPACER_GARDEROBA": {

    number: "06",

    name: "Garderoba",

    area: "2,35 m²"

  },

  "SPACER_SYPIALNIA_02": {

    number: "07",

    name: "Sypialnia 02",

    area: "12,63 m²"

  }

};


/* =====================================================
   KONWERSJA SKETCHUP → THREE
===================================================== */

const SKETCHUP_TO_THREE =
  1 / 39.37007874015748;


function convertPoint(point) {

  return {

    x:
      point.x *
      SKETCHUP_TO_THREE,

    y:
      point.z *
      SKETCHUP_TO_THREE,

    z:
      -point.y *
      SKETCHUP_TO_THREE

  };

}


/* =====================================================
   POBIERANIE JSON
===================================================== */

async function loadScenePoints() {

  const response =
    await fetch(
      "punkty_spaceru.json?" +
      Date.now()
    );


  if (!response.ok) {

    throw new Error(
      "Nie można wczytać punkty_spaceru.json"
    );

  }


  const data =
    await response.json();


  if (!Array.isArray(data)) {

    throw new Error(
      "Nieprawidłowy format JSON"
    );

  }


  scenes = data;


  console.log(
    "Pobrano punkty spaceru:",
    scenes
  );


  createRoomButtons();

}


/* =====================================================
   ZNAJDŹ SCENĘ
===================================================== */

function getScene(name) {

  return scenes.find(

    item =>
      item.name === name

  );

}


/* =====================================================
   MENU POMIESZCZEŃ
===================================================== */

function createRoomButtons() {

  const rooms =
    document.getElementById(
      "rooms"
    );


  rooms.innerHTML = "";


  const title =
    document.createElement(
      "div"
    );


  title.className =
    "roomsTitle";


  title.textContent =
    "Pomieszczenia";


  rooms.appendChild(
    title
  );


  Object.keys(
    roomSettings
  ).forEach(

    (sceneName) => {

      const settings =
        roomSettings[
          sceneName
        ];


      const sceneData =
        getScene(
          sceneName
        );


      if (!sceneData) {

        console.warn(
          "Brak sceny:",
          sceneName
        );

        return;

      }


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "room";


      button.dataset.scene =
        sceneName;


      const number =
        document.createElement(
          "span"
        );


      number.className =
        "roomNumber";


      number.textContent =
        settings.number;


      const name =
        document.createElement(
          "span"
        );


      name.className =
        "roomName";


      name.textContent =
        settings.name;


      const area =
        document.createElement(
          "span"
        );


      area.className =
        "roomArea";


      area.textContent =
        settings.area;


      button.appendChild(
        number
      );

      button.appendChild(
        name
      );

      button.appendChild(
        area
      );


      button.addEventListener(

        "click",

        () => {

          renderer.clippingPlanes =
            [];


          hideStartScreen();


          smoothMoveTo(
            sceneData
          );


          updateRoomActive(
            sceneName
          );

        }

      );


      rooms.appendChild(
        button
      );

    }

  );

}


/* =====================================================
   AKTYWNE POMIESZCZENIE
===================================================== */

function updateRoomActive(
  sceneName
) {

  document
    .querySelectorAll(
      ".room"
    )
    .forEach(

      button => {

        button.classList.toggle(

          "active",

          button.dataset.scene ===
          sceneName

        );

      }

    );

}


/* =====================================================
   KAMERA Z PUNKTU JSON
===================================================== */

function setCameraFromScene(
  sceneData
) {

  if (!sceneData)
    return;


  const position =
    convertPoint(
      sceneData.eye
    );


  const target =
    convertPoint(
      sceneData.target
    );


  camera.position.set(

    position.x,

    position.y,

    position.z

  );


  camera.up.set(
    0,
    1,
    0
  );


  camera.fov =
    sceneData.fov ||
    70;


  camera.updateProjectionMatrix();


  camera.lookAt(

    target.x,

    target.y,

    target.z

  );


  updateAnglesFromCamera(

    position,

    target

  );

}


/* =====================================================
   WIDOK STARTOWY Z GÓRY
===================================================== */

function showTopView() {

  const start =
    getScene(
      "SPACER_START"
    );


  if (!start) {

    console.warn(
      "Brak SPACER_START"
    );

    return;

  }


  if (topCutPlane) {

    renderer.clippingPlanes =
      [topCutPlane];

  }


  const position =
    convertPoint(
      start.eye
    );


  const target =
    convertPoint(
      start.target
    );


  camera.position.set(

    position.x,

    position.y,

    position.z

  );


  camera.up.set(

    0,

    0,

    -1

  );


  camera.fov =
    start.fov ||
    35;


  camera.updateProjectionMatrix();


  camera.lookAt(

    target.x,

    target.y,

    target.z

  );

}


/* =====================================================
   START SCREEN
===================================================== */

function hideStartScreen() {

  document
    .getElementById(
      "startScreen"
    )
    .classList.add(
      "hidden"
    );

}


/* =====================================================
   START SPACERU
===================================================== */

function startWalk() {

  renderer.clippingPlanes =
    [];


  hideStartScreen();


  const start =
    getScene(
      "SPACER_KORYTARZ"
    );


  if (start) {

    setCameraFromScene(
      start
    );

    updateRoomActive(
      "SPACER_KORYTARZ"
    );

  }

}


/* =====================================================
   PŁYNNE PRZEJŚCIE
===================================================== */

let cameraTransition = null;


function smoothMoveTo(
  sceneData
) {

  if (!sceneData)
    return;


  const position =
    convertPoint(
      sceneData.eye
    );


  const target =
    convertPoint(
      sceneData.target
    );


  const startPosition =
    camera.position.clone();


  const startDirection =
    new THREE.Vector3();


  camera.getWorldDirection(
    startDirection
  );


  const endDirection =
    new THREE.Vector3()
      .subVectors(
        target,
        position
      )
      .normalize();


  cameraTransition = {

    startPosition,

    endPosition:
      new THREE.Vector3(

        position.x,

        1.65,

        position.z

      ),

    startDirection,

    endDirection,

    startTime:
      performance.now(),

    duration:
      900

  };


  camera.fov =
    sceneData.fov ||
    70;


  camera.updateProjectionMatrix();

}


/* =====================================================
   AKTUALIZACJA PRZEJŚCIA
===================================================== */

function updateCameraTransition() {

  if (!cameraTransition)
    return;


  const now =
    performance.now();


  let progress =

    (
      now -
      cameraTransition.startTime
    ) /
    cameraTransition.duration;


  progress =
    Math.min(
      progress,
      1
    );


  const eased =
    progress *
    progress *
    (
      3 -
      2 *
      progress
    );


  camera.position.lerpVectors(

    cameraTransition.startPosition,

    cameraTransition.endPosition,

    eased

  );


  const direction =
    new THREE.Vector3()
      .lerpVectors(

        cameraTransition.startDirection,

        cameraTransition.endDirection,

        eased

      )
      .normalize();


  const lookTarget =
    camera.position
      .clone()
      .add(
        direction.multiplyScalar(2)
      );


  camera.lookAt(
    lookTarget
  );


  if (
    progress >= 1
  ) {

    camera.position.copy(
      cameraTransition.endPosition
    );


    cameraTransition =
      null;

  }

}


/* =====================================================
   LOAD MODEL
===================================================== */

const loading =
  document.getElementById(
    "loading"
  );


const loader =
  new GLTFLoader();


async function loadModel() {

  try {

    const files = [

      "mieszkanie.part1",

      "mieszkanie.part2"

    ];


    const buffers =
      await Promise.all(

        files.map(

          async file => {

            const response =
              await fetch(

                file +
                "?" +
                Date.now()

              );


            if (!response.ok) {

              throw new Error(

                "Nie można wczytać " +
                file

              );

            }


            return response
              .arrayBuffer();

          }

        )

      );


    const total =

      buffers[0].byteLength +

      buffers[1].byteLength;


    const combined =
      new Uint8Array(
        total
      );


    combined.set(

      new Uint8Array(
        buffers[0]
      ),

      0

    );


    combined.set(

      new Uint8Array(
        buffers[1]
      ),

      buffers[0].byteLength

    );


    await new Promise(

      (resolve, reject) => {

        loader.parse(

          combined.buffer,

          "",

          gltf => {

            model =
              gltf.scene;


            scene.add(
              model
            );


            modelBox =
              new THREE.Box3()
                .setFromObject(
                  model
                );


            modelCenter =
              modelBox.getCenter(
                new THREE.Vector3()
              );


            modelSize =
              modelBox.getSize(
                new THREE.Vector3()
              );


            console.log(
              "MODEL CENTER:",
              modelCenter
            );


            console.log(
              "MODEL SIZE:",
              modelSize
            );


            const cutY =

              modelBox.min.y +

              modelSize.y *
              0.78;


            topCutPlane =
              new THREE.Plane(

                new THREE.Vector3(
                  0,
                  -1,
                  0
                ),

                cutY

              );


            resolve();

          },

          error => {

            reject(
              error
            );

          }

        );

      }

    );


    await loadScenePoints();


    showTopView();


    loading
      .classList
      .add(
        "hidden"
      );


  }

  catch(error) {

    console.error(
      "BŁĄD:",
      error
    );


    loading
      .querySelector(
        ".loadingText"
      )
      .textContent =

        "Błąd: " +
        error.message;

  }

}


loadModel();


/* =====================================================
   MOUSE LOOK
===================================================== */

let yaw = 0;

let pitch = 0;

let dragging = false;

let previousX = 0;

let previousY = 0;


renderer.domElement.addEventListener(

  "pointerdown",

  event => {

    if (

      !document
        .getElementById(
          "startScreen"
        )
        .classList
        .contains(
          "hidden"
        )

    ) {

      return;

    }


    dragging = true;


    previousX =
      event.clientX;


    previousY =
      event.clientY;


    renderer.domElement
      .setPointerCapture(
        event.pointerId
      );

  }

);


renderer.domElement.addEventListener(

  "pointermove",

  event => {

    if (!dragging)
      return;


    const dx =

      event.clientX -
      previousX;


    const dy =

      event.clientY -
      previousY;


    previousX =
      event.clientX;


    previousY =
      event.clientY;


    yaw -=
      dx * 0.003;


    pitch -=
      dy * 0.0025;


    const limit =
      Math.PI / 2.1;


    pitch =

      Math.max(

        -limit,

        Math.min(
          limit,
          pitch
        )

      );

  }

);


renderer.domElement.addEventListener(

  "pointerup",

  () => {

    dragging = false;

  }

);


renderer.domElement.addEventListener(

  "pointercancel",

  () => {

    dragging = false;

  }

);


/* =====================================================
   KLAWIATURA
===================================================== */

const keys = {};


window.addEventListener(

  "keydown",

  event => {

    keys[
      event.key.toLowerCase()
    ] = true;

  }

);


window.addEventListener(

  "keyup",

  event => {

    keys[
      event.key.toLowerCase()
    ] = false;

  }

);


/* =====================================================
   RUCH WASD
   BRAK KOLIZJI
===================================================== */

const direction =
  new THREE.Vector3();


const right =
  new THREE.Vector3();


const move =
  new THREE.Vector3();


function updateMovement() {

  if (

    !document
      .getElementById(
        "startScreen"
      )
      .classList
      .contains(
        "hidden"
      )

  ) {

    return;

  }


  if (cameraTransition) {

    return;

  }


  move.set(
    0,
    0,
    0
  );


  direction.set(

    -Math.sin(yaw),

    0,

    -Math.cos(yaw)

  );


  right.set(

    Math.cos(yaw),

    0,

    -Math.sin(yaw)

  );


  if (keys["w"])
    move.add(
      direction
    );


  if (keys["s"])
    move.sub(
      direction
    );


  if (keys["a"])
    move.sub(
      right
    );


  if (keys["d"])
    move.add(
      right
    );


  if (
    move.lengthSq() > 0
  ) {

    move.normalize();


    move.multiplyScalar(
      0.035
    );


    // BRAK KOLIZJI
    // Można przechodzić przez
    // meble, ściany i model.

    camera.position.add(
      move
    );

  }


  camera.position.y =
    1.65;

}


/* =====================================================
   LOOK
===================================================== */

function updateLook() {

  if (

    !document
      .getElementById(
        "startScreen"
      )
      .classList
      .contains(
        "hidden"
      )

  ) {

    return;

  }


  if (cameraTransition) {

    return;

  }


  const lookDistance =
    2;


  const target =
    new THREE.Vector3(

      camera.position.x -

        Math.sin(yaw) *

        Math.cos(pitch) *

        lookDistance,


      camera.position.y +

        Math.sin(pitch) *

        lookDistance,


      camera.position.z -

        Math.cos(yaw) *

        Math.cos(pitch) *

        lookDistance

    );


  camera.lookAt(
    target
  );

}


/* =====================================================
   AKTUALIZACJA KĄTÓW
===================================================== */

function updateAnglesFromCamera(

  position,

  target

) {

  const dx =

    target.x -
    position.x;


  const dy =

    target.y -
    position.y;


  const dz =

    target.z -
    position.z;


  yaw =

    Math.atan2(

      -dx,

      -dz

    );


  pitch =

    Math.atan2(

      dy,

      Math.sqrt(

        dx * dx +

        dz * dz

      )

    );

}

/* =====================================================
   FULLSCREEN
===================================================== */

async function fullscreen() {

  try {

    if (
      !document.fullscreenElement
    ) {

      await document
        .documentElement
        .requestFullscreen();

    }

    else {

      await document
        .exitFullscreen();

    }

  }

  catch(error) {

    console.error(
      error
    );

  }

}


document
  .getElementById(
    "fullscreenButton"
  )
  .addEventListener(
    "click",
    fullscreen
  );


document
  .getElementById(
    "fullscreenButton2"
  )
  .addEventListener(
    "click",
    fullscreen
  );

/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

  "resize",

  () => {

    camera.aspect =

      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

      window.innerWidth,

      window.innerHeight

    );

  }

);


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

  requestAnimationFrame(
    animate
  );


  updateCameraTransition();


  updateMovement();


  updateLook();


  renderer.render(

    scene,

    camera

  );

}


animate();
